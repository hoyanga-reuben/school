<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teacher Transfer System - Login</title>
    {% load static %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url("{% static 'images/background.png' %}") no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            margin: 0;
        }

        .login-header {
            background-color: #003366;
            color: white;
            padding: 1rem;
            text-align: center;
        }

        .login-header img {
            height: 60px;
            transition: transform 0.3s ease;
        }

        .login-header img:hover {
            transform: scale(1.05);
        }

        .login-card {
            background-color: white;
            border-radius: 15px;
            max-width: 400px;
            padding: 2rem;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            width: 90%;
        }

        .form-control:focus {
            border-color: #003366;
            box-shadow: 0 0 0 0.2rem rgba(0, 51, 102, 0.25);
        }

        a {
            color: #003366;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<!-- Government-like Header -->
<div class="login-header d-flex align-items-center justify-content-center gap-3">
    <img src="{% static 'images/logo.png' %}" alt="Logo">
    <div>
        <h4 class="mb-0">TAMISEMI - Teacher Transfer System</h4>
    </div>
</div>

<!-- Login Form Container -->
<div class="d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 100px);">
    <div class="login-card">
        <h5 class="text-center mb-4">Login to Your Account</h5>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <input type="text" name="username" class="form-control" placeholder="Username" required>
            </div>
            <div class="mb-3">
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'password_reset' %}">Forgot Password?</a><br>
            <a href="{% url 'transfers:register_teacher' %}">Don't have an account? Register</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
